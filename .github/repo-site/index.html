<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>idjo Extensions</title>
<meta name="description" content="Aniyomi extensions by idjo. Works in Aniyomi and forks such as Anikku.">
<style>
  :root {
    --bg: #f7f7f8; --card: #ffffff; --text: #17181c; --muted: #62646d;
    --border: #e3e4e8; --accent: #2f6fde; --accent-text: #ffffff; --chip: #eef0f4;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1012; --card: #18191d; --text: #ececef; --muted: #9a9ca5;
      --border: #2a2b31; --accent: #6c9bff; --accent-text: #0f1012; --chip: #24262c;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 760px; margin: 0 auto; padding: 32px 16px 48px; }
  h1 { font-size: 26px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 20px; }
  .add {
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    padding: 16px; margin-bottom: 24px;
  }
  .add p { margin: 0 0 10px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  code.url {
    flex: 1 1 260px; min-width: 0; overflow-wrap: anywhere; font-size: 13px;
    background: var(--chip); border-radius: 8px; padding: 8px 10px;
  }
  .btn {
    display: inline-flex; align-items: center; justify-content: center;
    border: 1px solid var(--border); background: var(--card); color: var(--text);
    border-radius: 8px; padding: 8px 14px; font: inherit; font-weight: 600;
    text-decoration: none; cursor: pointer; white-space: nowrap;
  }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
  input[type=search] {
    width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--border);
    background: var(--card); color: var(--text); font: inherit; margin-bottom: 12px;
  }
  .count { color: var(--muted); font-size: 13px; margin-bottom: 8px; }
  ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
  li {
    display: flex; gap: 12px; align-items: center; background: var(--card);
    border: 1px solid var(--border); border-radius: 12px; padding: 12px;
  }
  li img { width: 48px; height: 48px; border-radius: 10px; flex: none; background: var(--chip); }
  .info { flex: 1; min-width: 0; }
  .name { font-weight: 600; }
  .meta { color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
  .tag { display: inline-block; background: var(--chip); border-radius: 6px; padding: 0 6px; font-size: 12px; margin-left: 4px; }
  footer { color: var(--muted); font-size: 13px; margin-top: 28px; }
  footer a, .sub a { color: var(--accent); }
  .empty { color: var(--muted); padding: 16px 0; }
</style>
</head>
<body>
<main>
  <h1>idjo Extensions</h1>
  <p class="sub">Aniyomi extensions. They work in <a href="https://github.com/aniyomiorg/aniyomi">Aniyomi</a> and its forks, such as <a href="https://github.com/komikku-app/anikku">Anikku</a>.</p>

  <section class="add">
    <p><strong>Add this repo to your app</strong>, then install extensions from the Extensions tab.</p>
    <div class="row">
      <code class="url" id="repo-url"></code>
      <button class="btn" id="copy" type="button">Copy</button>
      <a class="btn primary" id="deeplink" href="#">Add to app</a>
    </div>
  </section>

  <input type="search" id="q" placeholder="Search extensions or languages" aria-label="Search extensions">
  <div class="count" id="count"></div>
  <ul id="list"><li class="empty">Loading…</li></ul>

  <footer>
    You can also download an APK directly and install it by hand.
    Source and issues: <a href="https://github.com/idjoo/extensions-source">idjoo/extensions-source</a>.
  </footer>
</main>
<script>
  const RAW = "https://raw.githubusercontent.com/idjoo/extensions/repo/index.min.json";
  document.getElementById("repo-url").textContent = RAW;
  document.getElementById("deeplink").href = "aniyomi://add-repo?url=" + encodeURIComponent(RAW);
  document.getElementById("copy").addEventListener("click", async (e) => {
    try { await navigator.clipboard.writeText(RAW); e.target.textContent = "Copied"; }
    catch { e.target.textContent = "Copy failed"; }
    setTimeout(() => (e.target.textContent = "Copy"), 1500);
  });

  const langName = (code) => {
    if (code === "all") return "Multi";
    try { return new Intl.DisplayNames(["en"], { type: "language" }).of(code) || code; }
    catch { return code; }
  };

  let exts = [];
  const list = document.getElementById("list");
  const count = document.getElementById("count");

  function render(q) {
    q = q.trim().toLowerCase();
    const shown = exts.filter((x) => !q || x.search.includes(q));
    count.textContent = shown.length + " of " + exts.length + " extensions";
    list.replaceChildren();
    if (!shown.length) {
      const li = document.createElement("li");
      li.className = "empty"; li.textContent = "No extensions match.";
      list.append(li); return;
    }
    for (const x of shown) {
      const li = document.createElement("li");
      const img = document.createElement("img");
      img.src = "icon/" + x.pkg + ".png"; img.alt = ""; img.loading = "lazy";
      const info = document.createElement("div"); info.className = "info";
      const name = document.createElement("div"); name.className = "name"; name.textContent = x.title;
      if (x.nsfw) { const t = document.createElement("span"); t.className = "tag"; t.textContent = "18+"; name.append(t); }
      const meta = document.createElement("div"); meta.className = "meta";
      meta.textContent = langName(x.lang) + " · v" + x.version + " · " + x.langs;
      info.append(name, meta);
      const a = document.createElement("a");
      a.className = "btn"; a.href = "apk/" + x.apk; a.textContent = "APK"; a.setAttribute("download", "");
      li.append(img, info, a);
      list.append(li);
    }
  }

  fetch("index.min.json", { cache: "no-cache" })
    .then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then((data) => {
      exts = data.map((e) => {
        const langs = [...new Set(e.sources.map((s) => s.lang))];
        const title = e.name.replace(/^Aniyomi:\s*/, "");
        return {
          ...e, title,
          langs: langs.length + (langs.length === 1 ? " language" : " languages"),
          search: [title, e.pkg, ...langs, ...langs.map(langName)].join(" ").toLowerCase(),
        };
      }).sort((a, b) => a.title.localeCompare(b.title));
      render("");
    })
    .catch(() => {
      list.innerHTML = '<li class="empty">Could not load the extension list.</li>';
    });
  document.getElementById("q").addEventListener("input", (e) => render(e.target.value));
</script>
</body>
</html>
