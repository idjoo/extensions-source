apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'kotlinx-serialization'

assert !ext.has("pkgNameSuffix")
assert !ext.has("libVersion")
assert extName.chars().max().asInt < 0x180 : "Extension name should be romanized"

android {
    compileSdkVersion AndroidConfig.compileSdk
    namespace AndroidConfig.namespace

    sourceSets {
        main {
            manifest.srcFile "AndroidManifest.xml"
            java.srcDirs = ['src']
            res.srcDirs = ['res']
        }
        test {
            java.srcDirs = ['test']
            resources.srcDirs = ['testResources']
        }
        release {
            manifest.srcFile "AndroidManifest.xml"
        }
        debug {
            manifest.srcFile "AndroidManifest.xml"
        }
    }

    defaultConfig {
        minSdkVersion AndroidConfig.minSdk
        targetSdkVersion AndroidConfig.targetSdk
        applicationIdSuffix project.parent.name + "." + project.name
        versionCode extVersionCode
        versionName "14.$versionCode"
        base {
            archivesName = "aniyomi-$applicationIdSuffix-v$versionName"
        }
        assert extClass.startsWith(".")
        manifestPlaceholders = [
                appName : "Aniyomi: $extName",
                extClass: extClass,
                nsfw    : project.ext.find("isNsfw") ? 1 : 0,
        ]
    }

    signingConfigs {
        release {
            def keystorePath = providers.environmentVariable("SIGNING_KEY_FILE").getOrElse("signingkey.jks")
            def keystoreFile = rootProject.file(keystorePath)
            if (keystoreFile.exists()) {
                storeFile keystoreFile
                storePassword providers.environmentVariable("KEY_STORE_PASSWORD").orNull
                keyAlias providers.environmentVariable("ALIAS").orNull
                keyPassword providers.environmentVariable("KEY_PASSWORD").orNull
            }
        }
    }

    buildTypes {
        release {
            def keystorePath = providers.environmentVariable("SIGNING_KEY_FILE").getOrElse("signingkey.jks")
            if (rootProject.file(keystorePath).exists()) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
        }
    }

    dependenciesInfo {
        includeInApk = false
    }

    buildFeatures {
        aidl false
        renderScript false
        resValues false
        shaders false
        buildConfig true
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlin {
        compilerOptions {
            jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_1_8
            freeCompilerArgs.add("-opt-in=kotlinx.serialization.ExperimentalSerializationApi")
        }
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    implementation(project(":core"))
    compileOnly(libs.bundles.common)
    testImplementation(libs.bundles.common)
    testImplementation(libs.junit)
    testImplementation(libs.okhttp.mockwebserver)
}
